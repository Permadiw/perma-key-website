name: Deploy PERMA KEY API to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$D1_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Configure D1 database ID
        working-directory: worker
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_ID/" wrangler.toml
          grep -q "database_id = \"$D1_ID\"" wrangler.toml

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Verify deployed Worker health endpoint
        shell: bash
        run: |
          URL="https://perma-key-api.herdiansyah0239.workers.dev/health"
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt/5: $URL"
            STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --output /tmp/perma-health.json --write-out '%{http_code}' "$URL" 2>/tmp/perma-curl-error.txt || true)"
            echo "HTTP status: ${STATUS:-000}"
            if [ -s /tmp/perma-health.json ]; then
              cat /tmp/perma-health.json
              echo
            fi
            if [ "$STATUS" = "200" ]; then
              echo "PERMA KEY API health check passed."
              exit 0
            fi
            if [ -s /tmp/perma-curl-error.txt ]; then
              cat /tmp/perma-curl-error.txt
            fi
            sleep 5
          done
          echo "::error::Worker deploy completed, but /health did not return HTTP 200. If the status is 000, check workers.dev routing or deployment account. If the status is 500, check the production DB binding and ADMIN_TOKEN secret on this exact Worker."
          exit 1

      - name: Verify loader endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://perma-key-api.herdiansyah0239.workers.dev/loader"
          curl --fail --silent --show-error --max-time 20 "$URL" -o /tmp/perma-loader.lua
          grep -q "VERIFY KEY & EXECUTE" /tmp/perma-loader.lua
          grep -q "GET FREE KEY" /tmp/perma-loader.lua
          echo "Loader endpoint passed: key UI and Free Key website button are present."

      - name: Verify script endpoint rejects missing key
        shell: bash
        run: |
          set -euo pipefail
          URL="https://perma-key-api.herdiansyah0239.workers.dev/script"
          STATUS="$(curl --silent --show-error --max-time 20 --output /tmp/perma-script-response.txt --write-out '%{http_code}' "$URL")"
          echo "No-key script endpoint HTTP status: $STATUS"
          cat /tmp/perma-script-response.txt
          test "$STATUS" = "400"
          grep -q "PERMA_KEY_ERROR" /tmp/perma-script-response.txt
          echo "Script endpoint correctly rejects requests without a key."
