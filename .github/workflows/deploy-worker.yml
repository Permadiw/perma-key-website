name: Deploy PERMA KEY API to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$D1_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)
          test -n "$ADMIN_TOKEN" || (echo "Missing ADMIN_TOKEN secret. Add it in GitHub Settings > Secrets and variables > Actions." && exit 1)

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Configure D1 database ID
        working-directory: worker
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_ID/" wrangler.toml
          grep -q "database_id = \"$D1_ID\"" wrangler.toml

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Sync ADMIN_TOKEN to Cloudflare Worker Secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: printf "%s" "$ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN

      - name: Verify API root is not serving the website HTML
        shell: bash
        run: |
          set -euo pipefail
          URL="https://perma-key-api.herdiansyah0239.workers.dev/"
          STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --output /tmp/perma-root.json --write-out '%{http_code}' "$URL")"
          echo "Root HTTP status: $STATUS"
          echo "Root response preview:"
          head -c 1000 /tmp/perma-root.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::API root must return HTTP 200."
            exit 1
          fi
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/perma-root.json","utf8"));if(d.success!==true||d.service!=="PERMA KEY API"||d.deployment!=="repair-deploy-2026-10-17-v2"||d.status!=="online"){console.error("Root returned unexpected content; expected the active PERMA KEY API build, not the website HTML.");process.exit(1)}console.log("API root build identity passed.")'

      - name: Verify deployed Worker health endpoint
        shell: bash
        run: |
          set -u
          URL="https://perma-key-api.herdiansyah0239.workers.dev/health"
          for attempt in $(seq 1 12); do
            echo "Health check attempt $attempt/12: $URL"
            STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --output /tmp/perma-health.json --write-out '%{http_code}' "$URL" 2>/tmp/perma-curl-error.txt || true)"
            echo "HTTP status: ${STATUS:-000}"
            if [ -s /tmp/perma-health.json ]; then
              echo "Response body:"
              head -c 1500 /tmp/perma-health.json
              echo
            fi
            if [ "$STATUS" = "200" ] && node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/perma-health.json","utf8"));if(d.success===true&&d.status==="online"&&d.databaseConfigured===true)process.exit(0);process.exit(1)'; then
              echo "PERMA KEY API health and D1 binding checks passed."
              exit 0
            fi
            echo "Health response must confirm status=online and databaseConfigured=true before the deployment is accepted."
            if [ -s /tmp/perma-curl-error.txt ]; then cat /tmp/perma-curl-error.txt; fi
            # Cloudflare may briefly route workers.dev requests to a stale edge version after deployment.
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::Worker health endpoint did not return HTTP 200 after 12 attempts. Check the response body and Cloudflare Worker hostname assignment."
          exit 1

      - name: Verify Free Key task session API and CORS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://perma-key-api.herdiansyah0239.workers.dev/public/tasks/start"
          echo "Checking preflight response..."
          OPTIONS_STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 15 --output /tmp/perma-options.txt --write-out '%{http_code}' -X OPTIONS "$URL" -H "Origin: https://permafreekey.pages.dev" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" || true)"
          echo "OPTIONS HTTP status: $OPTIONS_STATUS"
          if [ "$OPTIONS_STATUS" != "204" ]; then
            cat /tmp/perma-options.txt || true
            echo "::error::Free Key CORS preflight did not return HTTP 204."
            exit 1
          fi
          echo "Creating a test task session..."
          STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 30 --output /tmp/perma-task-start.json --write-out '%{http_code}' "$URL" -X POST -H "Origin: https://permafreekey.pages.dev" -H "Content-Type: text/plain;charset=UTF-8" -H "Accept: application/json" --data '{}')"
          echo "Task session HTTP status: $STATUS"
          cat /tmp/perma-task-start.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::Free Key task session endpoint did not return HTTP 200."
            exit 1
          fi
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/perma-task-start.json","utf8"));if(d.success!==true||!d.session_id||!Array.isArray(d.tasks)||d.tasks.length<1){console.error("Invalid task session response: expected success, session_id and at least one task.");process.exit(1)}console.log("Free Key task session passed with "+d.tasks.length+" active tasks.")'

      - name: Verify loader endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://perma-key-api.herdiansyah0239.workers.dev/loader"
          STATUS="000"
          for attempt in 1 2 3 4 5; do
            echo "Loader check attempt $attempt/5: $URL"
            STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --output /tmp/perma-loader.lua --write-out '%{http_code}' "$URL" 2>/tmp/perma-loader-curl-error.txt || true)"
            echo "HTTP status: ${STATUS:-000}"
            if [ "$STATUS" = "200" ] && grep -q "VERIFY KEY & EXECUTE" /tmp/perma-loader.lua && grep -q "GET FREE KEY" /tmp/perma-loader.lua; then
              echo "Loader endpoint passed: key UI and Free Key website button are present."
              exit 0
            fi
            if [ -s /tmp/perma-loader.lua ]; then
              echo "Loader response preview:"
              head -c 1000 /tmp/perma-loader.lua
              echo
            fi
            if [ -s /tmp/perma-loader-curl-error.txt ]; then
              cat /tmp/perma-loader-curl-error.txt
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error::Loader verification failed after 5 attempts (last HTTP status: ${STATUS:-000}). Check the response preview above and confirm the deployed Worker includes GET /loader."
          exit 1

      - name: Verify execute endpoint rejects an invalid key
        shell: bash
        run: |
          set -u
          URL="https://perma-key-api.herdiansyah0239.workers.dev/execute?key=PERMA-CI-INVALID-KEY"
          for attempt in 1 2 3 4 5; do
            echo "Invalid-key execute check attempt $attempt/5: $URL"
            STATUS="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --output /tmp/perma-script-response.txt --write-out '%{http_code}' "$URL" 2>/tmp/perma-execute-curl-error.txt || true)"
            echo "HTTP status: ${STATUS:-000}"
            if [ -s /tmp/perma-script-response.txt ]; then
              echo "Response body:"
              head -c 1000 /tmp/perma-script-response.txt
              echo
            fi
            if [ "$STATUS" = "403" ] && grep -q "PERMA_KEY_ERROR" /tmp/perma-script-response.txt; then
              echo "Execute endpoint is routed correctly and rejects an invalid key."
              exit 0
            fi
            if [ -s /tmp/perma-execute-curl-error.txt ]; then cat /tmp/perma-execute-curl-error.txt; fi
            # Cloudflare workers.dev routing may briefly return a stale 404 after deploy.
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error::Execute endpoint did not reject the invalid key with HTTP 403 after 5 attempts."
          exit 1
